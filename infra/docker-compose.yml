version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pulsewatch-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./pulsewatch.db
      - CORS_ORIGINS=["http://localhost:3000", "http://localhost:80"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pulsewatch-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: pulsewatch-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pulsewatch-net

networks:
  pulsewatch-net:
    driver: bridge

