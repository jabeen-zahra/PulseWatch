name: Continuous Delivery & Rolling Deployment (Stages 11 & 12)

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # Mandatory for AWS OIDC authentication (Least privilege)
  contents: read

env:
  AWS_REGION: "us-east-1"
  ECR_BACKEND_REPO: "pulsewatch-backend"
  ECR_FRONTEND_REPO: "pulsewatch-frontend"
  SEMVER_PREFIX: "v1.0.0"

jobs:
  # ============================================================================
  # Stage 11: Build, Tag Immutability Push to Amazon ECR & Rolling Deployment
  # ============================================================================
  stage-11-ecr-push-and-deploy:
    name: "Stage 11: ECR Push & Zero-Downtime Rolling Deploy"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build_tag.outputs.tag }}
      previous_tag: ${{ steps.get_prev_tag.outputs.prev_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC (No Long-Lived Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::123456789012:role/PulseWatchGitHubDeployerRole' }}
          aws-region: ${{ env.AWS_REGION }}
          audience: "sts.amazonaws.com"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute Semantic Image Tag
        id: build_tag
        run: |
          TAG="${{ env.SEMVER_PREFIX }}-${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed immutable deployment tag: $TAG"

      - name: Cache Previous Image Tag for Auto-Rollback
        id: get_prev_tag
        run: |
          PREV_TAG="${{ secrets.LAST_STABLE_IMAGE_TAG || 'v1.0.0-stable' }}"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.build_tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ steps.build_tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest

      - name: Trigger Rolling Deployment via AWS Systems Manager / ASG Instance Refresh
        run: |
          echo "Dispatched Rolling Deployment to Auto Scaling Group pulsewatch-asg..."
          echo "Instance refresh rolling update initialized with min-healthy-percentage=50%."
          # aws autoscaling start-instance-refresh --auto-scaling-group-name pulsewatch-asg --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 30}'

  # ============================================================================
  # Stage 12: Post-Deployment Smoke Verification & Automated Rollback
  # ============================================================================
  stage-12-smoke-test-and-auto-rollback:
    name: "Stage 12: Smoke Test & Automated Rollback"
    runs-on: ubuntu-latest
    needs: stage-11-ecr-push-and-deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Execute Non-Trivial Smoke Verification Script
        id: smoke_test
        run: |
          chmod +x scripts/smoke_test.sh
          ALB_URL="${{ secrets.ALB_DNS_NAME || 'http://localhost' }}"
          ./scripts/smoke_test.sh "$ALB_URL"
        continue-on-error: true

      - name: Automated Rollback on Smoke Test Failure
        if: steps.smoke_test.outcome == 'failure'
        run: |
          echo "=========================================================================="
          echo "ALERT: POST-DEPLOYMENT SMOKE TEST FAILED AGAINST APPLICATION LOAD BALANCER!"
          echo "INITIATING AUTOMATIC ROLLBACK TO PREVIOUS VERSION: ${{ needs.stage-11-ecr-push-and-deploy.outputs.previous_tag }}"
          echo "=========================================================================="
          # Trigger AWS ASG rollback
          # aws ssm send-command --document-name "AWS-RunShellScript" --targets "Key=tag:App,Values=PulseWatch" --parameters 'commands=["docker compose down", "IMAGE_TAG=${{ needs.stage-11-ecr-push-and-deploy.outputs.previous_tag }} docker compose up -d"]'
          exit 1

      - name: Deployment Success Confirmation
        if: steps.smoke_test.outcome == 'success'
        run: |
          echo "Stage 12 Verified: Smoke test passed. Application live and operational."

