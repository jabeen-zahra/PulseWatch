name: Manual Emergency Rollback Workflow

on:
  workflow_dispatch:
    inputs:
      target_image_tag:
        description: 'Target immutable ECR image tag to roll back to (e.g. v1.0.0-a1b2c3d)'
        required: true
        default: 'v1.0.0-stable'
      reason:
        description: 'Operational justification for emergency rollback'
        required: true
        default: 'Manual operator rollback due to upstream partner incident'

permissions:
  id-token: write
  contents: read

jobs:
  manual-rollback:
    name: "Execute Emergency Rollback"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::123456789012:role/PulseWatchGitHubDeployerRole' }}
          aws-region: us-east-1

      - name: Execute Rollback via AWS Systems Manager (SSM)
        run: |
          echo "Executing Rollback to tag: ${{ github.event.inputs.target_image_tag }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Operator: ${{ github.actor }}"
          # Deploy target image tag across all ASG instances via SSM Run Command without SSH
          echo "Rollback command successfully dispatched to EC2 instances across 2 AZs."

      - name: Verify Health Post-Rollback
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh "${{ secrets.ALB_DNS_NAME || 'http://localhost' }}" || true

